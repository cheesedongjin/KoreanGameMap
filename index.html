<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대한민국 행정구역 별칭 커스텀 지도</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f8fafc;
        }
        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        /* 컨트롤 패널 유저 인터페이스 */
        .control-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 16px;
            border-radius: 40px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.15);
            display: flex;
            gap: 12px;
            align-items: center;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .panel-section {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .panel-label {
            font-size: 13px;
            font-weight: 700;
            color: #475569;
            white-space: nowrap;
        }
        .btn-group {
            display: flex;
            background: #f1f5f9;
            padding: 4px;
            border-radius: 20px;
        }
        .btn-level {
            padding: 6px 16px;
            border: none;
            background: transparent;
            border-radius: 16px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
            transition: all 0.2s ease;
        }
        .btn-level.active {
            background: #2563eb;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
        }
        /* 팝업 스타일 */
        .alias-popup .leaflet-popup-content-wrapper {
            padding: 4px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .popup-container {
            padding: 12px;
            min-width: 240px;
        }
        .popup-orig-name {
            font-size: 11px;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .popup-alias-display {
            font-size: 24px;
            font-weight: 800;
            color: #2563eb;
            margin: 6px 0 16px 0;
            line-height: 1.2;
            word-break: break-all;
        }
        .popup-input-group {
            display: flex;
            gap: 6px;
        }
        .popup-input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 13px;
            color: #1e293b;
            outline: none;
        }
        .popup-input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
        }
        .popup-btn {
            padding: 8px 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        .popup-btn:hover {
            background: #1d4ed8;
        }
        /* 지도 내 상시 표시 툴팁 레이아웃 */
        .label-tooltip {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            font-weight: 700;
            color: #1e293b;
            text-shadow: -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 2px 2px 0 #fff;
            text-align: center;
            font-size: 11px;
            pointer-events: none; /* 툴팁이 맵 마우스 이벤트를 가로채지 않도록 방지 */
        }
        .tooltip-alias {
            display: block;
            font-size: 16px;
            color: #2563eb;
            font-weight: 900;
            margin-top: 2px;
            letter-spacing: -0.3px;
        }
        /* 로딩 인디케이터 */
        .loading-shield {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(248, 250, 252, 0.7);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            color: #1e293b;
            font-size: 16px;
            pointer-events: none; /* 부드러운 이동을 위해 로딩 중 조작 허용 */
            transition: opacity 0.2s ease;
        }
        .loading-shield.hidden {
            opacity: 0;
        }
    </style>
</head>
<body>

<div id="loading" class="loading-shield hidden">행정구역 경계 데이터 로드 중...</div>

<div class="control-panel">
    <div class="panel-section">
        <span class="panel-label">행정구역 레벨</span>
        <div class="btn-group">
            <button id="btn-sido" class="btn-level" onclick="changeLevel('sido')">시도</button>
            <button id="btn-sgg" class="btn-level" onclick="changeLevel('sgg')">시군구</button>
            <button id="btn-emd" class="btn-level active" onclick="changeLevel('emd')">읍면동</button>
        </div>
    </div>
</div>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">
    import * as adk from "https://esm.sh/admdongkor";

    // 1. 지도 초기화
    const map = L.map('map', { 
        zoomControl: false,
        preferCanvas: true // 성능 최적화를 위해 Canvas 렌더러 강제 활성화
    }).setView([36.2, 127.8], 7);
    
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CARTO'
    }).addTo(map);

    // 2. 상태 관리 및 데이터 캐시 메모리 딕셔너리
    let currentLevel = 'emd';   
    let geojsonLayer = null;
    const CACHE_NAME = 'admdongkor-geojson-cache-v1';
    const geoJsonMemoryCache = {}; // 매번 캐시 스토리지 여는 비용 절감을 위한 메모리 캐시

    const versions = adk.versions();
    const latestVersionKey = versions[versions.length - 1];
    const aliasStorage = JSON.parse(localStorage.getItem('adk_local_aliases')) || {};

    // 3. 레벨 변경 탭 연동
    window.changeLevel = function(level) {
        currentLevel = level;
        document.querySelectorAll('.btn-level').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-${level}`).classList.add('active');
        renderCurrentView();
    };

    // 4. 줌 레벨 및 뷰 상태에 따른 데이터 소스 로드 (전역 캐싱 전략)
    async function getGeoJsonData(level) {
        if (geoJsonMemoryCache[level]) return geoJsonMemoryCache[level];

        const cacheKey = `https://local.admdongkor.internal/${latestVersionKey}/${level}`;
        try {
            const cache = await caches.open(CACHE_NAME);
            let cachedResponse = await cache.match(cacheKey);
            let geoData;

            if (cachedResponse) {
                geoData = await cachedResponse.json();
            } else {
                document.getElementById('loading').classList.remove('hidden');
                geoData = await adk.get(latestVersionKey, level, { detail: false });
                const responseToCache = new Response(JSON.stringify(geoData), {
                    headers: { 'Content-Type': 'application/json' }
                });
                await cache.put(cacheKey, responseToCache);
            }
            geoJsonMemoryCache[level] = geoData;
            return geoData;
        } catch (e) {
            console.error("캐시 로드 실패, 라이브러리 다이렉트 호출:", e);
            return await adk.get(latestVersionKey, level, { detail: false });
        } finally {
            document.getElementById('loading').classList.add('hidden');
        }
    }

    // 5. 핵심: 현재 줌 상태와 보이는 영역 영역(Bounding Box)에 맞게 레이어 계산 후 그리기
    async function renderCurrentView() {
        const currentZoom = map.getZoom();
        let targetRenderLevel = currentLevel;
        let isTemporaryUpperLevel = false;

        // 줌 조건에 따른 동적 LOD 레벨 스위칭 알고리즘
        if (currentLevel === 'emd') {
            if (currentZoom <= 8) {
                targetRenderLevel = 'sido';
                isTemporaryUpperLevel = true;
            } else if (currentZoom > 8 && currentZoom <= 11) {
                targetRenderLevel = 'sgg';
                isTemporaryUpperLevel = true;
            }
        } else if (currentLevel === 'sgg') {
            if (currentZoom <= 8) {
                targetRenderLevel = 'sido';
                isTemporaryUpperLevel = true;
            }
        }

        // 렌더링할 타겟 레벨 전체 데이터 획득
        const fullGeoJson = await getGeoJsonData(targetRenderLevel);
        
        if (geojsonLayer) {
            map.removeLayer(geojsonLayer);
        }

        // 현재 화면 눈에 보이는 영역 경계 좌표(Bounds) 추출
        const mapBounds = map.getBounds();

        // 바운딩 박스 필터링: 화면 범위 내에 교차하는 피처만 메모리상에서 골라냄
        const filteredFeatures = fullGeoJson.features.filter(feature => {
            if (!feature.geometry) return false;
            
            // 단순화를 위해 피처의 좌표 배열 일부 혹은 전체 바운더리가 맵 스크린 내에 충족하는지 체크
            // Leaflet의 L.geoJSON 내부 파서 연산을 최적화하기 위해 경계 근사 체크
            return true; 
        });

        const filteredGeoJson = {
            type: "FeatureCollection",
            features: filteredFeatures
        };

        // 레이어화 및 이벤트 주입
        geojsonLayer = L.geoJSON(filteredGeoJson, {
            style: (feature) => styleFeature(feature, targetRenderLevel, isTemporaryUpperLevel),
            onEachFeature: (feature, layer) => onEachFeature(feature, layer, targetRenderLevel, isTemporaryUpperLevel),
            filter: function(feature) {
                // 더 정확한 지오메트리 스크린 교차 필터링 (가벼운 Bounding Box 연산)
                // 좌표 하나라도 맵 범위 내에 있다면 그리기
                if(feature.geometry.type === "Polygon") {
                    return feature.geometry.coordinates[0].some(coord => mapBounds.contains(L.latLng(coord[1], coord[0])));
                } else if(feature.geometry.type === "MultiPolygon") {
                    return feature.geometry.coordinates.some(poly => 
                        poly[0].some(coord => mapBounds.contains(L.latLng(coord[1], coord[0])))
                    );
                }
                return true;
            }
        }).addTo(map);
    }

    // 6. 스타일 엔진
    function styleFeature(feature, renderLevel, isTemp) {
        const p = feature.properties;
        const code = p.emdcd || p.sggcd || p.sidocd;
        const lookupKey = code || p.emdnm || p.sggnm || p.sidonm;
        
        // 중요: 임시 상위 레벨 뷰일때는 별칭 하이라이트를 먹이지 않음
        const hasAlias = !isTemp && aliasStorage[lookupKey];

        return {
            fillColor: hasAlias ? '#dbeafe' : '#ffffff',
            weight: renderLevel === 'sido' ? 2.5 : renderLevel === 'sgg' ? 1.6 : 1,
            opacity: 1,
            color: hasAlias ? '#2563eb' : '#cbd5e1',
            fillOpacity: hasAlias ? 0.6 : 0.1
        };
    }

    // 7. 팝업 및 이벤트 위임 바인딩
    function onEachFeature(feature, layer, renderLevel, isTemp) {
        const p = feature.properties;
        const name = p.emdnm || p.sggnm || p.sidonm || "알 수 없는 지역";
        const code = p.emdcd || p.sggcd || p.sidocd;
        const lookupKey = code || name;

        // 툴팁 노출 제어: 임시 상위 레벨일 때는 텍스트 뒤에 별칭을 붙이지 않음
        applyCustomTooltip(layer, name, lookupKey, isTemp);

        // 중요: 임시 상위 레벨 구조일 때는 클릭과 마우스 오버 효과를 아예 막아버림
        if (isTemp) {
            return; 
        }

        layer.on('click', function(e) {
            const currentAlias = aliasStorage[lookupKey] || "";
            const popupHtml = `
                <div class="popup-container">
                    <div class="popup-orig-name">${name}</div>
                    <div class="popup-alias-display">${currentAlias || "(별칭 없음)"}</div>
                    <div class="popup-input-group">
                        <input type="text" class="popup-input" id="popup-input-${lookupKey}" value="${currentAlias}" placeholder="지정할 별칭 입력">
                        <button class="popup-btn" id="popup-save-btn-${lookupKey}">저장</button>
                    </div>
                </div>
            `;
            layer.bindPopup(popupHtml, { className: 'alias-popup' }).openPopup(e.latlng);

            setTimeout(() => {
                const btn = document.getElementById(`popup-save-btn-${lookupKey}`);
                if (btn) {
                    btn.onclick = function() {
                        const inputVal = document.getElementById(`popup-input-${lookupKey}`).value.trim();
                        executeSaveAlias(lookupKey, name, inputVal, layer);
                    };
                }
            }, 50);
        });

        layer.on('mouseover', () => {
            layer.setStyle({ fillOpacity: 0.4, weight: currentLevel === 'emd' ? 2 : 3 });
        });
        layer.on('mouseout', () => {
            geojsonLayer.resetStyle(layer);
        });
    }

    function applyCustomTooltip(layer, originalName, lookupKey, isTemp) {
        const alias = !isTemp ? aliasStorage[lookupKey] : null;
        const content = alias 
            ? `${originalName}<span class="tooltip-alias">${alias}</span>`
            : originalName;

        layer.bindTooltip(content, {
            permanent: true,
            direction: 'center',
            className: 'label-tooltip'
        });
    }

    function executeSaveAlias(lookupKey, originalName, value, layer) {
        if (value) {
            aliasStorage[lookupKey] = value;
        } else {
            delete aliasStorage[lookupKey];
        }
        localStorage.setItem('adk_local_aliases', JSON.stringify(aliasStorage));
        renderCurrentView(); // 저장이 완료되면 화면을 다시 계산하여 갱신
        map.closePopup();
    }

    // 8. 맵 관찰자 이벤트리스너 등록
    // 유저가 지도를 움직이거나(moveend), 줌 배율을 바꿀 때(zoomend)마다 최적화 영역을 새로 계산
    map.on('moveend zoomend', () => {
        renderCurrentView();
    });

    // 3개 레벨 사전 내부 백그라운드 캐싱 지시 연출
    (async () => {
        await getGeoJsonData('sido');
        await getGeoJsonData('sgg');
        await getGeoJsonData('emd');
        renderCurrentView();
    })();
</script>

</body>
</html>
