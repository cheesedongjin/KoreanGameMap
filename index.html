<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대한민국 행정구역 별칭 지도</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
            background-color: #f4f6f9;
        }
        /* 상단 컨트롤 바 */
        .control-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 24px;
            border-radius: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .level-indicator {
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }
        .btn-level {
            padding: 6px 14px;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        .btn-level.active {
            background: #007bff;
            color: #fff;
            border-color: #007bff;
        }
        /* 커스텀 팝업 스타일 */
        .alias-popup .leaflet-popup-content-wrapper {
            padding: 5px;
            border-radius: 12px;
        }
        .popup-container {
            padding: 10px;
            min-width: 220px;
        }
        .popup-orig-name {
            font-size: 12px;
            color: #666;
        }
        .popup-alias-display {
            font-size: 22px;
            font-weight: 800;
            color: #007bff;
            margin: 5px 0 12px 0;
            word-break: break-all;
        }
        .popup-input-group {
            display: flex;
            gap: 5px;
        }
        .popup-input {
            flex: 1;
            padding: 6px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 13px;
        }
        .popup-btn {
            padding: 6px 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .popup-btn:hover {
            background: #0056b3;
        }
        /* 지도 위 툴팁 (지명 상시 표시용) */
        .label-tooltip {
            background: transparent;
            border: none;
            box-shadow: none;
            font-weight: bold;
            color: #333;
            text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;
            text-align: center;
        }
        .tooltip-alias {
            display: block;
            font-size: 14px;
            color: #007bff;
            font-weight: 800;
        }
    </style>
</head>
<body>

    <div class="control-panel">
        <span class="level-indicator">현재 레벨:</span>
        <button class="btn-level active" onclick="changeLevel('ctprvn')">시도</button>
        <button class="btn-level" onclick="changeLevel('sig')">시군구</button>
        <button class="btn-level" onclick="changeLevel('emd')">읍면동</button>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. 지도 초기화 (대한민국 중심)
        const map = L.map('map', {
            zoomControl: false
        }).setView([36.2, 127.8], 7);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // 배경 지도 레이어 (공공 GIS 기반의 깔끔한 무채색 배경 선택)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO'
        }).addTo(map);

        // 2. 상태 관리 변수
        let currentLevel = 'ctprvn'; // ctprvn(시도), sig(시군구), emd(읍면동)
        let geojsonLayer = null;
        
        // localStorage에서 별칭 데이터 로드
        const aliasStorage = JSON.parse(localStorage.getItem('map_aliases')) || {};

        // 3. vuski/admdongkor GitHub의 최신 GeoJSON 데이터 매핑 경로
        // 데이터 크기가 크므로 rawgit CDN 레이어를 활용합니다.
        const dataUrls = {
            ctprvn: 'https://raw.githubusercontent.com/vuski/admdongkor/master/ver20230701/GeoJSON/admcode00.json', // 시도 (예시용 간소화 파일 경로 확인 필요)
            sig: 'https://raw.githubusercontent.com/vuski/admdongkor/master/ver20230701/GeoJSON/admcode01.json',
            emd: 'https://raw.githubusercontent.com/vuski/admdongkor/master/ver20230701/GeoJSON/admcode02.json'
        };

        // 데이터 파싱을 원활하게 하기 위해, 레벨별 고유 코드 및 이름 프로퍼티 매핑 정의
        const propConfig = {
            ctprvn: { code: 'ctprvn_cd', name: 'ctprvn_nm' },
            sig: { code: 'sig_cd', name: 'sig_nm' },
            emd: { code: 'adm_cd', name: 'adm_nm' }
        };

        // 4. 지도 레벨 변경 함수
        function changeLevel(level) {
            currentLevel = level;
            
            // 버튼 UI 업데이트
            document.querySelectorAll('.btn-level').forEach(btn => {
                btn.classList.remove('active');
                if(btn.innerText === (level === 'ctprvn' ? '시도' : level === 'sig' ? '시군구' : '읍면동')) {
                    btn.classList.add('active');
                }
            });

            loadGeoJSON();
        }

        // 5. GeoJSON 데이터 로드 및 렌더링
        async function loadGeoJSON() {
            if (geojsonLayer) {
                map.removeLayer(geojsonLayer);
            }

            // 실시간 데이터 로드 시 프론트엔드 단절 방지를 위해 데이터 셋 확인 유도
            // *실제 활용 시 vuski 저장소 내 대용량 분할본 또는 통합본 경로에 맞춰 동작합니다.
            // 아래는 admdongkor의 대표적인 파일 트리 기반 비동기 가져오기 파이프라인입니다.
            try {
                // vuski 리포지토리 특성상 전국 단위 통짜 GeoJSON은 용량이 매우 크므로 실서버용 CDN 경로로 우회 요청 처리
                const response = await fetch(`https://raw.githubusercontent.com/vuski/admdongkor/master/ver20230701/GeoJSON/admcode_${currentLevel === 'ctprvn' ? '1' : currentLevel === 'sig' ? '2' : '3'}.json`).catch(() => 
                    // 위 경로 실패 시 백업용(명칭 상이할 경우 조정 레이어)
                    fetch(`https://raw.githubusercontent.com/vuski/admdongkor/master/ver20230701/GeoJSON/admcode0${currentLevel === 'ctprvn' ? '0' : currentLevel === 'sig' ? '1' : '2'}.json`)
                );
                
                if(!response.ok) throw new Error("네트워크 응답 불안정");
                const data = await response.json();

                geojsonLayer = L.geoJSON(data, {
                    style: styleFeature,
                    onEachFeature: onEachFeature
                }).addTo(map);

            } catch (error) {
                console.error("데이터 로드 실패:", error);
                alert("행정구역 데이터를 가져오는 중 오류가 발생했습니다. (vuski 저장소 파일 경로 구조 확인 필요)");
            }
        }

        // 6. 행정구역 다각형 스타일 지정
        function styleFeature(feature) {
            const codeProp = currentLevel === 'ctprvn' ? 'sidonm' : currentLevel === 'sig' ? 'signm' : 'adm_nm'; 
            // vuski 데이터의 속성 키 자동 추적 변환 보정
            const regionCode = feature.properties.adm_cd || feature.properties.adm_cd2 || feature.properties.ctprvn_cd || feature.properties.sig_cd;
            const hasAlias = aliasStorage[regionCode];

            return {
                fillColor: hasAlias ? '#e1f0ff' : '#ffffff',
                weight: 1.5,
                opacity: 1,
                color: hasAlias ? '#007bff' : '#999',
                fillOpacity: hasAlias ? 0.6 : 0.2
            };
        }

        // 7. 각 행정구역 레이어 이벤트 바인딩
        function onEachFeature(feature, layer) {
            // vuski 데이터 필드 유연화 매핑 (행정구역명 찾기)
            const props = feature.properties;
            const regionName = props.adm_nm || props.emd_nm || props.sig_nm || props.ctprvn_nm || "미확인 지역";
            const regionCode = props.adm_cd || props.adm_cd2 || props.ctprvn_cd || props.sig_cd;

            // 상시 표시될 툴팁 셋팅 (이름 및 별칭 크게 보이기)
            updateTooltip(layer, regionName, regionCode);

            // 클릭 시 별칭 수정 팝업 오픈
            layer.on('click', function (e) {
                const currentAlias = aliasStorage[regionCode] || "";
                
                const popupContent = `
                    <div class="popup-container">
                        <div class="popup-orig-name">${regionName}</div>
                        <div class="popup-alias-display" id="disp-${regionCode}">${currentAlias || "(별칭 없음)"}</div>
                        <div class="popup-input-group">
                            <input type="text" class="popup-input" id="input-${regionCode}" value="${currentAlias}" placeholder="새 별칭 입력">
                            <button class="popup-btn" onclick="saveAlias('${regionCode}', '${regionName}')">저장</button>
                        </div>
                    </div>
                `;

                layer.bindPopup(popupContent, { className: 'alias-popup' }).openPopup(e.latlng);
            });

            // 마우스 오버 피드백 효과
            layer.on('mouseover', function () {
                layer.setStyle({ fillOpacity: 0.5, weight: 2.5 });
            });
            layer.on('mouseout', function () {
                geojsonLayer.resetStyle(layer);
            });
        }

        // 툴팁 텍스트 업데이트 내부 함수
        function updateTooltip(layer, regionName, regionCode) {
            const alias = aliasStorage[regionCode];
            const displayTitle = alias 
                ? `${regionName}<span class="tooltip-alias">${alias}</span>` 
                : regionName;

            layer.bindTooltip(displayTitle, {
                permanent: true,
                direction: 'center',
                className: 'label-tooltip'
            });
        }

        // 8. 별칭 저장 함수 (글로벌 스코프 배치)
        window.saveAlias = function(code, originalName) {
            const inputVal = document.getElementById(`input-${code}`).value.trim();
            
            if(inputVal) {
                aliasStorage[code] = inputVal;
            } else {
                delete aliasStorage[code]; // 빈칸 입력시 제거
            }

            // localStorage 영구 저장
            localStorage.setItem('map_aliases', JSON.stringify(aliasStorage));

            // 데이터 리로드 없이 실시간 레이어 스타일 및 팝업 갱신
            geojsonLayer.eachLayer(function(layer) {
                const props = layer.feature.properties;
                const rCode = props.adm_cd || props.adm_cd2 || props.ctprvn_cd || props.sig_cd;
                if(rCode === code) {
                    // 지도 스타일 갱신
                    geojsonLayer.resetStyle(layer);
                    // 툴팁(텍스트) 갱신
                    layer.unbindTooltip();
                    updateTooltip(layer, originalName, code);
                    // 팝업 닫기
                    map.closePopup();
                }
            });
        };

        // 최초 실행 (시도 레벨 로드)
        loadGeoJSON();
    </script>
</body>
</html>
