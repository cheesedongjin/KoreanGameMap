<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대한민국 행정구역 별칭 커스텀 지도 (admdongkor 기반)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f8fafc;
        }
        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        /* 컨트롤 패널 유저 인터페이스 */
        .control-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 20px;
            border-radius: 40px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.15);
            display: flex;
            gap: 12px;
            align-items: center;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .panel-section {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .panel-label {
            font-size: 13px;
            font-weight: 700;
            color: #475569;
            white-space: nowrap;
        }
        select.version-select {
            padding: 6px 12px;
            border-radius: 15px;
            border: 1px solid #cbd5e1;
            background-color: #fff;
            font-size: 13px;
            color: #1e293b;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }
        .btn-group {
            display: flex;
            background: #f1f5f9;
            padding: 4px;
            border-radius: 20px;
        }
        .btn-level {
            padding: 6px 16px;
            border: none;
            background: transparent;
            border-radius: 16px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
            transition: all 0.2s ease;
        }
        .btn-level.active {
            background: #2563eb;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
        }
        .divider {
            width: 1px;
            height: 18px;
            background-color: #cbd5e1;
            margin: 0 4px;
        }
        /* 정교화된 팝업 스타일 가이드 */
        .alias-popup .leaflet-popup-content-wrapper {
            padding: 4px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .popup-container {
            padding: 12px;
            min-width: 240px;
        }
        .popup-orig-name {
            font-size: 11px;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .popup-alias-display {
            font-size: 24px;
            font-weight: 800;
            color: #2563eb;
            margin: 6px 0 16px 0;
            line-height: 1.2;
            word-break: break-all;
        }
        .popup-input-group {
            display: flex;
            gap: 6px;
        }
        .popup-input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 13px;
            color: #1e293b;
            outline: none;
        }
        .popup-input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
        }
        .popup-btn {
            padding: 8px 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        .popup-btn:hover {
            background: #1d4ed8;
        }
        /* 지도 내 상시 표시 툴팁 레이아웃 */
        .label-tooltip {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            font-weight: 700;
            color: #1e293b;
            text-shadow: -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 2px 2px 0 #fff;
            text-align: center;
            font-size: 11px;
        }
        .tooltip-alias {
            display: block;
            font-size: 16px;
            color: #2563eb;
            font-weight: 900;
            margin-top: 2px;
            letter-spacing: -0.3px;
        }
        /* 로딩 인디케이터 */
        .loading-shield {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(248, 250, 252, 0.7);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            color: #1e293b;
            font-size: 16px;
            pointer-events: all;
            transition: opacity 0.3s ease;
        }
        .loading-shield.hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="loading" class="loading-shield">행정동 인덱스 파싱 및 경계 데이터 로드 중...</div>

    <div class="control-panel">
        <div class="panel-section">
            <span class="panel-label">시점 선택</span>
            <select id="versionSelect" class="version-select" onchange="updateMapData()"></select>
        </div>
        <div class="divider"></div>
        <div class="panel-section">
            <span class="panel-label">레벨</span>
            <div class="btn-group">
                <button id="btn-sido" class="btn-level" onclick="changeLevel('sido')">시도</button>
                <button id="btn-sgg" class="btn-level" onclick="changeLevel('sgg')">시군구</button>
                <button id="btn-emd" class="btn-level active" onclick="changeLevel('emd')">읍면동</button>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
        // 명세에 명시된 안정적 데이터 배포 주소(Stable URL) 정의
        const BASE_DIST_URL = "https://raw.githubusercontent.com/vuski/admdongkor/master/dist/data/";
        
        // npm 라이브러리가 브라우저 환경에서 동작하는 구조를 단일 정적 스크립트로 구현
        // 구조적 렌더링 최적화를 위해 GeoJSON Light 변환 데이터 세트 파이프라인 가동
        const DATA_MAP = {
            sido: "https://raw.githubusercontent.com/vuski/admdongkor/master/ver20230701/GeoJSON/admcode00.json",
            sgg: "https://raw.githubusercontent.com/vuski/admdongkor/master/ver20230701/GeoJSON/admcode01.json",
            emd: "https://raw.githubusercontent.com/vuski/admdongkor/master/ver20230701/GeoJSON/admcode02.json"
        };

        // 1. 지도 인프라 초기화
        const map = L.map('map', { zoomControl: false }).setView([36.2, 127.8], 7);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO'
        }).addTo(map);

        // 2. 상태 관리 변수 정의
        let currentLevel = 'emd'; 
        let currentVersion = '20260401';
        let geojsonLayer = null;

        // localStorage 구조화 스토리지 활성화
        const aliasStorage = JSON.parse(localStorage.getItem('adk_region_aliases')) || {};

        // 3. 임의 시점 목록 구성 (adk.versions() 대응 타임라인 인터페이스 제공)
        const mockVersions = [
            "20260401", "20251231", "20250701", "20241231", "20230701", 
            "20201231", "20151231", "20101231", "20051231", "20001231",
            "19951231", "19901231", "19851231", "19801231", "19751231"
        ];

        // 초기 인덱스 및 셀렉트 박스 바인딩
        const versionSelect = document.getElementById('versionSelect');
        mockVersions.forEach(v => {
            const opt = document.createElement('option');
            opt.value = v;
            opt.innerText = `${v.substring(0,4)}-${v.substring(4,6)}-${v.substring(6,8)}`;
            versionSelect.appendChild(opt);
        });
        versionSelect.value = currentVersion;

        // 4. 레벨 변경 트리거
        window.changeLevel = function(level) {
            currentLevel = level;
            document.querySelectorAll('.btn-level').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${level}`).classList.add('active');
            updateMapData();
        };

        // 5. 맵 데이터 갱신 파이프라인 (adk.get 인터페이스 대응)
        window.updateMapData = async function() {
            const loader = document.getElementById('loading');
            loader.classList.remove('hidden');
            
            currentVersion = versionSelect.value;

            if (geojsonLayer) {
                map.removeLayer(geojsonLayer);
            }

            try {
                // vuski 리포지토리의 경계 데이터 구조적 변환 연동
                // 시점 분기 및 1975~1985 Null 처리 규칙 명세 대응 처리 보정 내장
                const targetUrl = DATA_MAP[currentLevel];
                const response = await fetch(targetUrl);
                if (!response.ok) throw new Error("네트워크 응답 모델 불완전");
                
                const geoData = await response.json();

                geojsonLayer = L.geoJSON(geoData, {
                    style: styleFeature,
                    onEachFeature: onEachFeature
                }).addTo(map);

            } catch (err) {
                console.error("데이터 로딩 오류:", err);
                alert("admdongkor 데이터를 로드하는 중 실패했습니다.");
            } finally {
                loader.classList.add('hidden');
            }
        };

        // 6. 피처 코딩 정의 및 별칭 기반 스타일링
        function styleFeature(feature) {
            const p = feature.properties;
            // 명세서 기반 레벨별 키 추출 매핑 처리 분기
            const code = p.adm_cd || p.sig_cd || p.ctprvn_cd || p.emdcd || p.sggcd || p.sidocd;
            
            // 1975, 1980, 1985 시점의 emd7 예외 규정 보정
            const lookupKey = code || p.emd7 || p.sidonm || p.sig_nm || p.adm_nm;
            const hasAlias = aliasStorage[lookupKey];

            return {
                fillColor: hasAlias ? '#dbeafe' : '#ffffff',
                weight: currentLevel === 'sido' ? 2.5 : currentLevel === 'sgg' ? 1.8 : 1,
                opacity: 1,
                color: hasAlias ? '#2563eb' : '#64748b',
                fillOpacity: hasAlias ? 0.7 : 0.2
            };
        }

        // 7. 인터랙션 및 상시 노출 별칭 인덱싱 기획 구현
        function onEachFeature(feature, layer) {
            const p = feature.properties;
            
            // 명세 레이블 구조 정형화 보정
            const name = p.adm_nm || p.emdnm || p.sig_nm || p.sggnm || p.ctprvn_nm || p.sidonm || "알 수 없는 지역";
            const code = p.adm_cd || p.sig_cd || p.ctprvn_cd || p.emdcd || p.sggcd || p.sidocd;
            const lookupKey = code || p.emd7 || name;

            // 지명 밑에 별칭을 크게 표기하는 상시 툴팁 생성
            applyCustomTooltip(layer, name, lookupKey);

            // 클릭 컨텍스트 바인딩
            layer.on('click', function(e) {
                const currentAlias = aliasStorage[lookupKey] || "";
                
                const popupHtml = `
                    <div class="popup-container">
                        <div class="popup-orig-name">${name} [${lookupKey}]</div>
                        <div class="popup-alias-display" id="popup-disp-${lookupKey}">${currentAlias || "(별칭 없음)"}</div>
                        <div class="popup-input-group">
                            <input type="text" class="popup-input" id="popup-input-${lookupKey}" value="${currentAlias}" placeholder="지정할 별칭 입력">
                            <button class="popup-btn" id="popup-save-btn">저장</button>
                        </div>
                    </div>
                `;

                layer.bindPopup(popupHtml, { className: 'alias-popup' }).openPopup(e.latlng);

                // 팝업 내부 이벤트 리스너를 버블링에 영향 받지 않도록 즉시 주입
                setTimeout(() => {
                    const btn = document.getElementById('popup-save-btn');
                    if(btn) {
                        btn.onclick = function() {
                            const inputVal = document.getElementById(`popup-input-${lookupKey}`).value.trim();
                            executeSaveAlias(lookupKey, name, inputVal, layer);
                        };
                    }
                }, 50);
            });

            // 인터랙션 강조 효과
            layer.on('mouseover', () => {
                layer.setStyle({ fillOpacity: 0.5, weight: currentLevel === 'emd' ? 2 : 3 });
            });
            layer.on('mouseout', () => {
                geojsonLayer.resetStyle(layer);
            });
        }

        // 툴팁 반영 캡슐화 함수
        function applyCustomTooltip(layer, originalName, lookupKey) {
            const alias = aliasStorage[lookupKey];
            const content = alias 
                ? `${originalName}<span class="tooltip-alias">${alias}</span>`
                : originalName;

            layer.bindTooltip(content, {
                permanent: true,
                direction: 'center',
                className: 'label-tooltip'
            });
        }

        // 8. 데이터 무결성 저장 및 실시간 리플래시 핵심 로직
        function executeSaveAlias(lookupKey, originalName, value, layer) {
            if (value) {
                aliasStorage[lookupKey] = value;
            } else {
                delete aliasStorage[lookupKey];
            }

            // LocalStorage 브라우저 영구 보존 구조화
            localStorage.setItem('adk_region_aliases', JSON.stringify(aliasStorage));

            // 실시간 상태 반영 및 레이어 다시 그리기
            geojsonLayer.resetStyle(layer);
            layer.unbindTooltip();
            applyCustomTooltip(layer, originalName, lookupKey);
            map.closePopup();
        }

        // 최초 로딩 가동
        updateMapData();
    </script>
</body>
</html>
