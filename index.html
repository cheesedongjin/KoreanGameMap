<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대한민국 행정구역 별칭 커스텀 지도</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f8fafc;
        }
        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        /* 컨트롤 패널 유저 인터페이스 */
        .control-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 16px;
            border-radius: 40px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.15);
            display: flex;
            gap: 12px;
            align-items: center;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .panel-section {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .panel-label {
            font-size: 13px;
            font-weight: 700;
            color: #475569;
            white-space: nowrap;
        }
        .btn-group {
            display: flex;
            background: #f1f5f9;
            padding: 4px;
            border-radius: 20px;
        }
        .btn-level {
            padding: 6px 16px;
            border: none;
            background: transparent;
            border-radius: 16px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
            transition: all 0.2s ease;
        }
        .btn-level.active {
            background: #2563eb;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
        }
        /* 팝업 스타일 */
        .alias-popup .leaflet-popup-content-wrapper {
            padding: 4px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .popup-container {
            padding: 12px;
            min-width: 240px;
        }
        .popup-orig-name {
            font-size: 11px;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .popup-alias-display {
            font-size: 24px;
            font-weight: 800;
            color: #2563eb;
            margin: 6px 0 16px 0;
            line-height: 1.2;
            word-break: break-all;
        }
        .popup-input-group {
            display: flex;
            gap: 6px;
        }
        .popup-input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 13px;
            color: #1e293b;
            outline: none;
        }
        .popup-input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
        }
        .popup-btn {
            padding: 8px 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        .popup-btn:hover {
            background: #1d4ed8;
        }
        /* 지도 내 상시 표시 툴팁 레이아웃 */
        .label-tooltip {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            font-weight: 700;
            color: #1e293b;
            text-shadow: -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 2px 2px 0 #fff;
            text-align: center;
            font-size: 11px;
        }
        .tooltip-alias {
            display: block;
            font-size: 16px;
            color: #2563eb;
            font-weight: 900;
            margin-top: 2px;
            letter-spacing: -0.3px;
        }
        /* 로딩 인디케이터 */
        .loading-shield {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(248, 250, 252, 0.7);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            color: #1e293b;
            font-size: 16px;
            pointer-events: all;
            transition: opacity 0.3s ease;
        }
        .loading-shield.hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="loading" class="loading-shield">최신 대한민국 행정구역 경계 데이터 로드 중...</div>

    <div class="control-panel">
        <div class="panel-section">
            <span class="panel-label">행정구역 레벨</span>
            <div class="btn-group">
                <button id="btn-sido" class="btn-level" onclick="changeLevel('sido')">시도</button>
                <button id="btn-sgg" class="btn-level" onclick="changeLevel('sgg')">시군구</button>
                <button id="btn-emd" class="btn-level active" onclick="changeLevel('emd')">읍면동</button>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // vuski 저장소의 최신 GeoJSON 배포 주소
        const DATA_MAP = {
            sido: "https://raw.githubusercontent.com/vuski/admdongkor/master/ver20230701/GeoJSON/admcode_1.json",
            sgg: "https://raw.githubusercontent.com/vuski/admdongkor/master/ver20230701/GeoJSON/admcode_2.json",
            emd: "https://raw.githubusercontent.com/vuski/admdongkor/master/ver20230701/GeoJSON/admcode_3.json"
        };

        // 1. 지도 인프라 초기화
        const map = L.map('map', { zoomControl: false }).setView([36.2, 127.8], 7);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO'
        }).addTo(map);

        // 2. 상태 관리 변수
        let currentLevel = 'emd'; 
        let geojsonLayer = null;

        // localStorage 저장소 활성화
        const aliasStorage = JSON.parse(localStorage.getItem('adk_latest_aliases')) || {};

        // 3. 레벨 변경 함수
        window.changeLevel = function(level) {
            currentLevel = level;
            document.querySelectorAll('.btn-level').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${level}`).classList.add('active');
            updateMapData();
        };

        // 4. 맵 데이터 비동기 패칭 및 상세 에러 트래킹 레이어
        window.updateMapData = async function() {
            const loader = document.getElementById('loading');
            loader.classList.remove('hidden');

            if (geojsonLayer) {
                map.removeLayer(geojsonLayer);
            }

            const targetUrl = DATA_MAP[currentLevel];

            try {
                const response = await fetch(targetUrl);
                
                // HTTP 상태 코드가 성공(200-299)이 아닐 경우 예외 발생 및 상세 명시
                if (!response.ok) {
                    throw new Error(`HTTP 에러 발생! 상태 코드: ${response.status} (${response.statusText})`);
                }
                
                const geoData = await response.json();

                geojsonLayer = L.geoJSON(geoData, {
                    style: styleFeature,
                    onEachFeature: onEachFeature
                }).addTo(map);

            } catch (err) {
                console.error("상세 에러 로그:", err);
                
                // 사용자 디버깅을 돕기 위해 오류 세부 원인을 팝업에 바인딩
                alert(
                    `[데이터 로드 실패]\n\n` +
                    `• 요청 레벨: ${currentLevel}\n` +
                    `• 요 청 주 소: ${targetUrl}\n` +
                    `• 에러 메시지: ${err.message}\n\n` +
                    `네트워크 단절, CORS 거부, 또는 주소 변경 여부를 확인해 주세요.`
                );
            } finally {
                loader.classList.add('hidden');
            }
        };

        // 5. 피처 렌더링 스타일 지정
        function styleFeature(feature) {
            const p = feature.properties;
            const code = p.adm_cd || p.sig_cd || p.ctprvn_cd || p.emdcd || p.sggcd || p.sidocd;
            const lookupKey = code || p.adm_nm || p.sig_nm || p.ctprvn_nm;
            const hasAlias = aliasStorage[lookupKey];

            return {
                fillColor: hasAlias ? '#dbeafe' : '#ffffff',
                weight: currentLevel === 'sido' ? 2.5 : currentLevel === 'sgg' ? 1.8 : 1,
                opacity: 1,
                color: hasAlias ? '#2563eb' : '#64748b',
                fillOpacity: hasAlias ? 0.7 : 0.2
            };
        }

        // 6. 각 구역별 이벤트 및 팝업 마운트
        function onEachFeature(feature, layer) {
            const p = feature.properties;
            const name = p.adm_nm || p.emdnm || p.sig_nm || p.sggnm || p.ctprvn_nm || p.sidonm || "알 수 없는 지역";
            const code = p.adm_cd || p.sig_cd || p.ctprvn_cd || p.emdcd || p.sggcd || p.sidocd;
            const lookupKey = code || name;

            applyCustomTooltip(layer, name, lookupKey);

            layer.on('click', function(e) {
                const currentAlias = aliasStorage[lookupKey] || "";
                
                const popupHtml = `
                    <div class="popup-container">
                        <div class="popup-orig-name">${name}</div>
                        <div class="popup-alias-display">${currentAlias || "(별칭 없음)"}</div>
                        <div class="popup-input-group">
                            <input type="text" class="popup-input" id="popup-input-${lookupKey}" value="${currentAlias}" placeholder="지정할 별칭 입력">
                            <button class="popup-btn" id="popup-save-btn-${lookupKey}">저장</button>
                        </div>
                    </div>
                `;

                layer.bindPopup(popupHtml, { className: 'alias-popup' }).openPopup(e.latlng);

                setTimeout(() => {
                    const btn = document.getElementById(`popup-save-btn-${lookupKey}`);
                    if (btn) {
                        btn.onclick = function() {
                            const inputVal = document.getElementById(`popup-input-${lookupKey}`).value.trim();
                            executeSaveAlias(lookupKey, name, inputVal, layer);
                        };
                    }
                }, 50);
            });

            layer.on('mouseover', () => {
                layer.setStyle({ fillOpacity: 0.5, weight: currentLevel === 'emd' ? 2 : 3 });
            });
            layer.on('mouseout', () => {
                geojsonLayer.resetStyle(layer);
            });
        }

        function applyCustomTooltip(layer, originalName, lookupKey) {
            const alias = aliasStorage[lookupKey];
            const content = alias 
                ? `${originalName}<span class="tooltip-alias">${alias}</span>`
                : originalName;

            layer.bindTooltip(content, {
                permanent: true,
                direction: 'center',
                className: 'label-tooltip'
            });
        }

        function executeSaveAlias(lookupKey, originalName, value, layer) {
            if (value) {
                aliasStorage[lookupKey] = value;
            } else {
                delete aliasStorage[lookupKey];
            }

            localStorage.setItem('adk_latest_aliases', JSON.stringify(aliasStorage));

            geojsonLayer.resetStyle(layer);
            layer.unbindTooltip();
            applyCustomTooltip(layer, originalName, lookupKey);
            map.closePopup();
        }

        // 첫 진입 시 최초 실행
        updateMapData();
    </script>
</body>
</html>
